<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Dash Cube</title>
    <link rel="stylesheet" href="splash.css">
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body { background: #050508; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        #gameContainer { width: 100%; max-width: 480px; height: 100%; max-height: 850px; position: relative; background: #0c0c0e; border: 2px solid #1a1a24; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; background: #0c0c0e; }
        
        .menu-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 10; background: rgba(12, 12, 14, 0.95); transition: opacity 0.3s; }
        .hidden { display: none !important; opacity: 0; pointer-events: none; }
        
        h1 { font-size: 36px; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 15px #00f2ff; color: #00f2ff; margin-bottom: 30px; text-align: center; }
        h2 { font-size: 24px; color: #ffd700; margin-bottom: 20px; text-transform: uppercase; }
        
        .stats-bar { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }
        
        .btn { width: 220px; padding: 14px; margin: 8px 0; border: none; border-radius: 8px; background: #1a1a24; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: all 0.2s; border: 1px solid #333; }
        .btn:active { transform: scale(0.95); background: #00f2ff; color: #000; box-shadow: 0 0 15px #00f2ff; }
        .btn-primary { background: #00f2ff; color: #000; border: none; }
        
        /* Profil Ekranı */
        .profile-card { background: #15151f; border: 1px solid #2a2a3a; padding: 20px; border-radius: 12px; width: 100%; max-width: 320px; text-align: center; }
        .profile-input { width: 100%; padding: 10px; margin: 15px 0; border-radius: 6px; border: 1px solid #3a3a50; background: #0c0c0e; color: #fff; text-align: center; font-size: 16px; }
        
        /* Mağaza ve Macera Gridleri */
        .grid-container { width: 100%; height: 320px; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 10px; margin-bottom: 15px; }
        .shop-item, .level-card { background: #15151f; border: 1px solid #2a2a3a; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; cursor: pointer; transition: all 0.2s; }
        .shop-item.equipped { border-color: #00f2ff; box-shadow: 0 0 10px rgba(0,242,255,0.3); }
        .level-card { font-size: 18px; font-weight: bold; height: 70px; }
        .level-card.unlocked { background: #1e293b; border-color: #3b82f6; }
        .level-card.unlocked:active { background: #3b82f6; color: #fff; }
        
        /* Oyun İçi Üst Göstergeler (HUD) */
        #gameHUD { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 5; font-size: 18px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none; }
    </style>
</head>
<body>

<div id="gameContainer">
    
    <div id="splashScreen">
        <div class="splash-content">
            <div class="splash-logo">HiGames</div>
            <div class="splash-sub">HALİL İBRAHİM ÜZER PRESENTS</div>
            <div class="splash-loader-container">
                <div class="splash-loader-bar"></div>
            </div>
        </div>
    </div>

    <div id="gameHUD" class="hidden">
        <div id="hudLeft">Skor: 0</div>
        <div id="hudRight">🪙 0</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="mainMenu" class="menu-screen hidden">
        <div class="stats-bar">
            <span id="menuUser">USER_1234</span>
            <span id="menuCoins">🪙 0</span>
        </div>
        <h1>Neon Dash</h1>
        <div id="menuBest" style="margin-bottom: 20px; color: #aaa; font-size: 14px;">EN YÜKSEK SKOR: 0</div>
        <button id="playMenuBtn" class="btn btn-primary">Oyna</button>
        <button id="profileMenuBtn" class="btn">Profil</button>
        <button id="shopMenuBtn" class="btn">Market</button>
    </div>

    <div id="profileMenu" class="menu-screen hidden">
        <h2>Oyuncu Profili</h2>
        <div class="profile-card">
            <label style="color: #aaa; font-size: 14px;">Kullanıcı Adı</label>
            <input type="text" id="usernameInput" class="profile-input" maxlength="15">
            <button id="saveProfileBtn" class="btn btn-primary" style="width:100px; padding:8px;">Kaydet</button>
        </div>
        <button id="backFromProfileBtn" class="btn" style="margin-top:20px;">Geri</button>
    </div>

    <div id="shopMenu" class="menu-screen hidden">
        <div id="shopBalance" style="position:absolute; top:15px; right:15px; color:#ffd700; font-weight:bold;">Bakiye: 🪙 0</div>
        <h2>Siber Market</h2>
        <div style="display:flex; gap:10px; margin-bottom:10px;">
            <button id="tabCubes" class="btn" style="width:110px; margin:0; padding:8px;">KÜPLER</button>
            <button id="tabDecors" class="btn" style="width:110px; margin:0; padding:8px;">TEMALAR</button>
        </div>
        <div id="cubesGrid" class="grid-container"></div>
        <div id="decorsGrid" class="grid-container hidden"></div>
        <button id="backFromShopBtn" class="btn">Geri</button>
    </div>

    <div id="modeMenu" class="menu-screen hidden">
        <h2>Mod Seçimi</h2>
        <button id="normalModeBtn" class="btn btn-primary">Normal Mod</button>
        <button id="adventureModeBtn" class="btn">Macera Modu (50 Bölüm)</button>
        <button id="backFromModeBtn" class="btn" style="margin-top:20px;">Geri</button>
    </div>

    <div id="difficultyMenu" class="menu-screen hidden">
        <h2>Zorluk Seviyesi</h2>
        <button id="easyBtn" class="btn" style="border-color:#22c55e; color:#22c55e;">KOLAY</button>
        <button id="normalBtn" class="btn" style="border-color:#eab308; color:#eab308;">ORTA</button>
        <button id="hardBtn" class="btn" style="border-color:#ef4444; color:#ef4444;">ZOR</button>
        <button id="backFromDiffBtn" class="btn" style="margin-top:20px;">Geri</button>
    </div>

    <div id="adventureMenu" class="menu-screen hidden">
        <h2>Macera Haritası</h2>
        <div id="adventureGrid" class="grid-container" style="height:400px; grid-template-columns: repeat(4, 1fr);"></div>
        <button id="backFromAdventureBtn" class="btn">Geri</button>
    </div>

    <div id="gameOverMenu" class="menu-screen hidden">
        <h1 id="gameOverTitle">ELENDİN!</h1>
        <div id="finalScore" style="font-size:20px; margin-bottom:10px;">Skor: 0</div>
        <div id="finalTarget" style="font-size:14px; color:#aaa; margin-bottom:10px;" class="hidden">Hedef: 0</div>
        <div id="gainedCoins" style="font-size:22px; color:#ffd700; margin-bottom:30px;">Kazanılan: +🪙 0</div>
        <button id="restartBtn" class="btn btn-primary">Yeniden Dene</button>
        <button id="toMenuBtn" class="btn">Ana Menü</button>
    </div>
</div>

<script src="shop.js"></script>
<script src="infinite-logic.js"></script>
<script src="infinite-view.js"></script>
<script src="adventure-logic.js"></script>
<script src="adventure-view.js"></script>

<script>
    // CSS'teki startLoading animasyonu 3. saniyede başlıyor ve 5 saniye sürüyor (Toplam 8 saniye).
    // 8. saniyede yükleme bitince pürüzsüzce opacity düşürme geçişini başlatıyoruz.
    setTimeout(() => {
        const splash = document.getElementById('splashScreen');
        splash.style.opacity = '0';
        splash.style.transform = 'scale(1.05)'; // Hafif ileri doğru sinematik uzaklaşma efekti
        
        // 2 saniyelik pürüzsüz CSS transition geçişi bittikten sonra (10. saniyede) tamamen kaldır ve menüyü aç
        setTimeout(() => {
            splash.style.display = 'none';
            document.getElementById('mainMenu').classList.remove('hidden');
        }, 2000);
        
    }, 8000);
</script>

</body>
</html>
