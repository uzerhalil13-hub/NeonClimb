<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Climb</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0c0c0e;
            font-family: sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 450px;
            max-height: 850px;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0c0c0e;
        }
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(12, 12, 14, 0.85);
            backdrop-filter: blur(5px);
            z-index: 10;
            color: #fff;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #00f2ff;
            color: #00f2ff;
        }
        .score-text {
            font-size: 1.6rem;
            margin-bottom: 30px;
            color: #bbb;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        button {
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0c0c0e;
            background: #00f2ff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            width: 220px;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.6);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        button.secondary {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 5;
            color: #fff;
            font-size: 1.4rem;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0,242,255,0.5);
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .shop-item {
            width: 65px;
            height: 65px;
            border: 3px solid #222;
            border-radius: 12px;
            cursor: pointer;
        }
        .shop-item.active {
            border-color: #00f2ff;
            box-shadow: 0 0 15px #00f2ff;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="hud">
            <div id="liveScore">Skor: 0</div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="mainMenu" class="ui-screen">
            <h1>Neon Climb</h1>
            <button id="startBtn">OYNA</button>
            <button id="shopBtn" class="secondary">KÜP MARKETİ</button>
        </div>

        <div id="gameOverMenu" class="ui-screen hidden">
            <h1 style="text-shadow: 0 0 15px #ff0055; color: #ff0055;">ELENDİN!</h1>
            <div id="finalScore" class="score-text">Skor: 0</div>
            <button id="restartBtn">TEKRAR OYNA</button>
            <button id="toMenuBtn" class="secondary">ANA MENÜ</button>
        </div>

        <div id="shopMenu" class="ui-screen hidden">
            <h1>Küp Market</h1>
            <div class="shop-grid">
                <div class="shop-item active" data-color="#00f2ff" style="background: #00f2ff;"></div>
                <div class="shop-item" data-color="#ff0055" style="background: #ff0055;"></div>
                <div class="shop-item" data-color="#39ff14" style="background: #39ff14;"></div>
                <div class="shop-item" data-color="#ffaa00" style="background: #ffaa00;"></div>
                <div class="shop-item" data-color="#9d00ff" style="background: #9d00ff;"></div>
                <div class="shop-item" data-color="#ffffff" style="background: #ffffff;"></div>
            </div>
            <button id="backToMenuBtn">GERİ DÖN</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
