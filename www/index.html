<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Climb</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #121214;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 450px;
            max-height: 850px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a1a1e;
        }
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(4px);
            z-index: 10;
            color: #fff;
            transition: opacity 0.3s ease;
        }
        .hidden {
            display: none !important;
            opacity: 0;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00f2ff;
        }
        .score-text {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #ccc;
        }
        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #121214;
            background: #00f2ff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            width: 200px;
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.4);
            transition: transform 0.1s, background 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        button.secondary {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 5;
            color: #fff;
            font-size: 1.3rem;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            padding: 10px;
        }
        .shop-item {
            width: 60px;
            height: 60px;
            border: 3px solid #333;
            border-radius: 10px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .shop-item.active {
            border-color: #00f2ff;
            box-shadow: 0 0 10px #00f2ff;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="hud">
            <div id="liveScore">Skor: 0</div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="mainMenu" class="ui-screen">
            <h1>Neon Climb</h1>
            <button id="startBtn">OYNA</button>
            <button id="shopBtn" class="secondary">KÜP MARKETİ</button>
        </div>

        <div id="gameOverMenu" class="ui-screen hidden">
            <h1 style="text-shadow: 0 0 10px #ff007f; color: #ff007f;">ELENDİN!</h1>
            <div id="finalScore" class="score-text">Skor: 0</div>
            <button id="restartBtn">TEKRAR OYNA</button>
            <button id="toMenuBtn" class="secondary">ANA MENÜ</button>
        </div>

        <div id="shopMenu" class="ui-screen hidden">
            <h1>Küp Market</h1>
            <p class="score-text" style="margin-bottom: 15px;">Bir stil seç:</p>
            <div class="shop-grid">
                <div class="shop-item active" data-color="#00f2ff" style="background: #00f2ff;"></div>
                <div class="shop-item" data-color="#ff007f" style="background: #ff007f;"></div>
                <div class="shop-item" data-color="#39ff14" style="background: #39ff14;"></div>
                <div class="shop-item" data-color="#ffaa00" style="background: #ffaa00;"></div>
                <div class="shop-item" data-color="#9d00ff" style="background: #9d00ff;"></div>
                <div class="shop-item" data-color="#ffffff" style="background: #ffffff;"></div>
            </div>
            <button id="backToMenuBtn">GERİ DÖN</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
